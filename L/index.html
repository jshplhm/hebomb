<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Open hebomb</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
:root { --bg: #fff; --card: #f0f0f3; --text: #000; --sub: #66666b; --cta: #00c805; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #fff; --sub: #98989f; } }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); color: var(--text); }
body { font: 600 17px/1.45 "Nunito", ui-rounded, system-ui, sans-serif; }
main { max-width: 420px; margin: 0 auto; padding: 80px 20px; text-align: center; }
h1 { font-size: 28px; font-weight: 900; }
p { color: var(--sub); margin-top: 10px; }
a.go { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; margin-top: 28px; background: var(--cta); color: #000; font-weight: 800; text-decoration: none; }
a.get { display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 999px; margin-top: 12px; background: var(--card); color: var(--text); font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1 id="h">Opening hebomb…</h1>
  <p id="p">hebomb asks once, then your computer opens.</p>
  <a class="go" id="go" href="#">Open in hebomb</a>
  <a class="get" href="/">Don't have hebomb?</a>
</main>
<script>
// The short code on hebomb.com/me opens this page on the iPhone (HTTPS://HEBOMB.COM/L#ID.KEY.DEVICE.LABEL, all base32
// capitals so the QR is small). It hands the # part, untouched, to the app (WebLink.swift). Never sent to a server.
(function () {
  var c = location.hash.slice(1).toUpperCase();
  if (!/^[A-Z2-7]{16}\.[A-Z2-7]{26}\.[A-Z2-7]{10}\.[A-Z]{2}$/.test(c)) {
    document.getElementById('h').textContent = "This code didn't come through";
    document.getElementById('p').textContent = 'Reload hebomb.com/me on your computer and scan again.';
    document.getElementById('go').hidden = true; return;
  }
  var url = 'hebomb://link?c=' + c;
  document.getElementById('go').href = url;
  location.href = url;
})();
</script>
</body>
</html>
